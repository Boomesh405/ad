spring:
  datasource:
    url: jdbc:h2:mem:estatehub_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # application.yml pins PostgreSQLDialect - override it for the in-memory H2 database
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
jwt:
  secret: test-secret-key-for-unit-tests-only-do-not-use-in-production-1234567890
razorpay:
  webhook-secret: razorpay-test-webhook-secret
digio:
  webhook-secret: digio-test-webhook-secret
