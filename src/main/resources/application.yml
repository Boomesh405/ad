server:
  port: 8080

spring:
  application:
    name: estatehub-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/estatehub
    username: ${DB_USERNAME:estatehub_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 60MB

jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_BYTES_FOR_HS512_ALGORITHM}
  access-token-expiry-ms: 3600000      # 1 hour, per SRS Appendix D
  refresh-token-expiry-ms: 604800000   # 7 days for buyer/tenant sessions

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:8082}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:estatehub-documents}
    region: ${AWS_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
  signed-url-expiry-seconds: 604800   # 7 days, per SRS FR9

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

digio:
  api-key: ${DIGIO_API_KEY:}
  api-secret: ${DIGIO_API_SECRET:}
  base-url: ${DIGIO_BASE_URL:https://api.digio.in}
  webhook-secret: ${DIGIO_WEBHOOK_SECRET:}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

platform:
  enquiry-rate-limit-per-hour: 5
  search-rate-limit-per-minute: 100
  default-grace-period-days: 5
  tds-threshold-monthly-rent: 50000
  tds-rate-percent: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.estatehub: INFO
    org.hibernate.SQL: WARN
